

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

</head>
<body>
    <section class="contact" id="contact">
<div class="image">

  <div class="text">
       <h1 class="heading">Get in Touch</h1>
  <p class="first"> Ready to boost your typing speed and master accuracy?</p>
  <p class="second">Our team is here to help.</p>
  </div>
</div>



    <h1 class="heading"><span>Contact Us</span> </h1>

<div class="div1">

    <form onsubmit="showToast(event)">


  
 <div class="row">

  <div class="input-group">
     <input type="text" placeholder="First name" class="box" required>
     <i class="fas fa-user"></i>
  </div>

  <div class="input-group">
     <input type="text" placeholder="Last name" class="box"required>
     <i class="fas fa-user"></i>
  </div>

</div>

<div class="input-group">
   <input type="email" placeholder="Email" class="box"required>
   <i class="fas fa-envelope"></i>
</div>

<div class="input-group">
   <input type="number" placeholder="Phone No." class="box"required>
   <i class="fas fa-phone"></i>
</div>

   <div class="input-group">
   <textarea class="box" placeholder="Message"required></textarea>
   <i class="fas fa-comment-dots"></i>
</div>

 
    <div class="btn-row">
   <button class="attach">
   <i class="fa-solid fa-paperclip"></i> Add attachment
</button>

 <button class="send" type="submit">Send message</button>

</div>

 
  </form>
</div>

</section> 




<footer class="footer">
  <div class="div2">
    <h2>Contact Info</h2>
    <div class="info">
        <i class="fas fa-envelope"></i>
        <span>support@typingclub.com</span>
    </div>

    <div class="info">
        <i class="fas fa-phone"></i>
        <span>+91 9829354070</span>
    </div>

    <div class="info">
        <i class="fas fa-location-dot"></i>
        <span>Jaipur, Rajasthan</span>
    </div>
  </div>

  <p class="copyright">
    © 2026 Typing Club. All rights reserved.
  </p>
</footer>



<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span>Message sent successfully!</span>
</div>

<script>
function showToast(e){
  e.preventDefault(); 

  const toast = document.getElementById("toast");
  toast.classList.add("show");

  document.querySelector("form").reset(); 

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000); //
}
</script>

</body>
</html>
