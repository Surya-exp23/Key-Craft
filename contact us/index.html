

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<body>
    <section class="contact" id="contact">
<div class="image">

  <div class="text">
       <h1 class="heading">Get in Touch</h1>
  <p class="first"> Ready to boost your typing speed and master accuracy?</p>
  <p class="second">Our team is here to help.</p>
  </div>
</div>



    <h1 class="heading"><span>Contact Us</span> </h1>

<div class="div1">
  <form action="">

  
 <div class="row">

  <div class="input-group">
     <input type="text" placeholder="First name" class="box">
     <i class="fas fa-user"></i>
  </div>

  <div class="input-group">
     <input type="text" placeholder="Last name" class="box">
     <i class="fas fa-user"></i>
  </div>

</div>

<div class="input-group">
   <input type="email" placeholder="Email" class="box">
   <i class="fas fa-envelope"></i>
</div>

<div class="input-group">
   <input type="number" placeholder="Phone No." class="box">
   <i class="fas fa-phone"></i>
</div>

   <div class="input-group">
   <textarea class="box" placeholder="Message"></textarea>
   <i class="fas fa-comment-dots"></i>
</div>

 
    <div class="btn-row">
   <button class="attach">
   <i class="fa-solid fa-paperclip"></i> Add attachment
</button>

 <button class="send" type="submit">Send message</button>

  </form>
</div>

  

 <div class="div2">

        <div class="info">
            <i class="fas fa-envelope"></i>
            <span>support@typingclub.com</span>
        </div>

        <div class="info">

        </div>

        <div class="info">
